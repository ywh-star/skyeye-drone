[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 接口与媒体资源代理到本机 FastAPI（由 cloudflared 隧道临时暴露）
# 注意：隧道地址每次重启 cloudflared 都会变化，需要同步更新此处并重新部署
[[redirects]]
  from = "/api/*"
  to = "https://injured-shapes-por-prerequisite.trycloudflare.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://injured-shapes-por-prerequisite.trycloudflare.com/media/:splat"
  status = 200
  force = true

# Vue Router history 模式：所有未命中静态资源的路径回退到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
